.file: &file
  filename: "gfx/EMU/Tunisia_SNCFT_YZ_E.png"

item:
  id: emu_Tunisia_SNCFT_YZ_E
  num: 0

  speed: 110                # ???
  power: 2340               # ???
  weight: 50                # ???
  te_coefficient: 0.20      # ???

  gauge: metre
  propulsion: electric_ac
  country: TN
  builders:
    - ganz_mavag

  life:
    start: 1984
    end: 2019               # ???

cargo:
  loading_speed: LOADINGSPEEDDEF_COMMUTER
  cargodef: CARGODEF_PASSENGERS

units:
  front:
    length: 8
    sprite: front
    capacity: 48
    vfx:
      offset: -3
  middle:
    length: 8
    capacity: 40
    sprite: middle
    vfx:
      custom: ""
  back:
    length: 8
    sprite: back
    capacity: 48

gfx:
  length: 8
  purchase:
    <<: *file
    x: 1
    y: 128
  spritesets:
    - id: front
      <<: *file
      template: template_2cc_engines_general
      x: 1
      y: 1
    - id: back
      <<: *file
      template: template_2cc_engines_general
      x: 1
      y: 32
    - id: middlepass
      <<: *file
      template: template_2cc_engines_general
      x: 1
      y: 64
    - id: middlepass_pantograph
      <<: *file
      template: template_2cc_engines_general
      x: 179
      y: 64
    - id: middlemail
      <<: *file
      template: template_2cc_engines_general
      x: 1
      y: 96
    - id: middlemail_pantograph
      <<: *file
      template: template_2cc_engines_general
      x: 179
      y: 96
  
  cargosets:
    - id: middle
      default:
        sprite: middlemail_position
      options:
        - bitmask: CC_PASSENGERS
          cargos: [PASS]
          sprite: middlepass_position
        - cargos: [MAIL]
          sprite: middlemail_position

  # Custom rules to implement a realistic pantograph location:
  # - first unit wagon always has a pantograph
  # - remaining ones have 10% chances of having a pantograph

  extra: >

    random_switch(FEAT_TRAINS, SELF, switch_emu_Tunisia_SNCFT_YZ_E_wagon_visual_effect_and_powered) {
      9: visual_effect_and_powered(VISUAL_EFFECT_DISABLE, 0, DISABLE_WAGON_POWER);
      1: visual_effect_and_powered(VISUAL_EFFECT_ELECTRIC, -3, DISABLE_WAGON_POWER);
    }

    random_switch(FEAT_TRAINS, SELF, spriteset_emu_Tunisia_SNCFT_YZ_E_middlepass_livery) {
      dependent: switch_emu_Tunisia_SNCFT_YZ_E_wagon_visual_effect_and_powered;
      9: spriteset_emu_Tunisia_SNCFT_YZ_E_middlepass;
      1: spriteset_emu_Tunisia_SNCFT_YZ_E_middlepass_pantograph;
    }

    random_switch(FEAT_TRAINS, SELF, spriteset_emu_Tunisia_SNCFT_YZ_E_middlemail_livery) {
      dependent: switch_emu_Tunisia_SNCFT_YZ_E_wagon_visual_effect_and_powered;
      9: spriteset_emu_Tunisia_SNCFT_YZ_E_middlemail;
      1: spriteset_emu_Tunisia_SNCFT_YZ_E_middlemail_pantograph;
    }

    switch(FEAT_TRAINS, SELF, spriteset_emu_Tunisia_SNCFT_YZ_E_middlepass_position, [STORE_TEMP(-1, 0x10F), var[0x61, 0, 0x0000FFFF, 0xC6]]) {
      ID_RANGE_UNIT_WAGONS: spriteset_emu_Tunisia_SNCFT_YZ_E_middlepass_livery;
      spriteset_emu_Tunisia_SNCFT_YZ_E_middlepass_pantograph;
    }

    switch(FEAT_TRAINS, SELF, spriteset_emu_Tunisia_SNCFT_YZ_E_middlemail_position, [STORE_TEMP(-1, 0x10F), var[0x61, 0, 0x0000FFFF, 0xC6]]) {
      ID_RANGE_UNIT_WAGONS: spriteset_emu_Tunisia_SNCFT_YZ_E_middlemail_livery;
      spriteset_emu_Tunisia_SNCFT_YZ_E_middlemail_pantograph;
    }
