.file: &file
  filename: "gfx/Steam/Australia_Tasmanian_Government_M.xpm"

item:
  id: steam_Australia_Tasmanian_Government_M
  num: 0

  # Some info from: (1) https://en.wikipedia.org/wiki/Tasmanian_Government_Railways_M_class_(1912)
  #                 (2) https://www.loco-info.com/view.aspx?id=13182

  speed: 80                 # (2) operating speed
  power: 1200               # (2)
  weight: 96                # (1)
  te: 109                   # (1)

  gauge: cape
  propulsion: steam
  country: AU
  builders:
    - beyer_peacock

  life:
    start: 1912     
    end: 1931               # (1) last unit withdrawn            

units:
