    sprite: front
    vfx:
      type: VISUAL_EFFECT_STEAM
      offset: -3
  - length: 4
    sprite: middle
  - length: 5
    sprite: back

gfx:
  length: 12
  purchase:
    <<: *file
    x: 1
    y: 160
  spritesets:
    - id: front_s1
      <<: *file
      template: template_2cc_engines_general
      x: 1
      y: 1
    - id: front_s2
      <<: *file
      template: template_2cc_engines_general
      x: 1
      y: 32
    - id: middle
      <<: *file
      template: template_2cc_engines_general
      x: 1
      y: 64
    - id: back_s1
      <<: *file
      template: template_2cc_engines_general
      x: 1
      y: 96
    - id: back_s2
      <<: *file
      template: template_2cc_engines_general
      x: 1
      y: 128
  animations:
    - id: front
      steps: [front_s1, front_s2]
    - id: back
      steps: [back_s1, back_s2]
