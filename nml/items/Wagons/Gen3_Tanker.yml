item:
  id: wagon_Narrow_Gen3_Tanker
  num: 0

  speed: 70
  weight: 14

  life:
    start: 1930

cargo:
  autorefit: true
  loading_speed: LOADINGSPEEDDEF_CARGO
  cargodef: CARGODEF_TANKER

units:
  wagon:
    length: 5
    sprite: standard
    capacity: 26

gfx:
  purchase:
    filename: "gfx/Wagons/Gen3/Tanker/Purchase.png"
    x: 1
    y: 1
  combine:
    default: oil
    rerandomize_cargos: false
    loadstages:
      loading: [S1]
      loaded: [S1]
      stages:
      - id: S1
        y: 1
    liveries:
      - id: L1
        x: 1
    cargos:
      - id: standard
        filename: "build/gfx/Gen3_Tanker_Standard.png"
      - id: milk
        cargos: [MILK]
        filename: "build/gfx/Gen3_Tanker_Milk.png"
      - id: oil
        cargos: [OIL_, OILI, OILD, PETR]
        filename: "build/gfx/Gen3_Tanker_Oil.png"
      - id: metal_cc1
        filename: "build/gfx/Gen3_Tanker_Metal_CC1.png"
      - id: metal_cc2
        filename: "build/gfx/Gen3_Tanker_Metal_CC2.png"
      - id: white_cc1
        filename: "build/gfx/Gen3_Tanker_White_CC1.png"
      - id: white_cc2
        filename: "build/gfx/Gen3_Tanker_White_CC2.png"
    random:
      - id: rubber
        cargos: [RUBR]
        options:
          standard: 1
      - id: goods
        cargos: [GOOD]
        options:
          standard: 1
          rubber: 1
      - id: chemicals
        cargos: [ACID, CHEM, SULP, NH3_, LYE_, O2__]
        options:
          white_cc1: 3
          white_cc2: 1
      - id: products
        cargos: [DYES, RFPR, CTAR, KAOL, COAT, MOLS, SOAP]
        options:
          metal_cc1: 3
          metal_cc2: 1
      - id: plastic
        cargos: [PLST, PLAS]
        options:
          standard: 1
          rubber: 1
      
