item:
  id: wagon_Narrow_Gen3_Flat_Wagon
  num: 0

  speed: 70
  weight: 9

  life:
    start: 1930

cargo:
  autorefit: true
  loading_speed: LOADINGSPEEDDEF_CARGO
  cargodef: CARGODEF_FLAT_WAGON

units:
  wagon:
    length: 5
    sprite: crates
    capacity: 24

gfx:
  purchase:
    filename: "gfx/Wagons/Gen3/Flat_Wagon/Purchase.png"
    x: 1
    y: 1

  combine:
    default: crates
    rerandomize_cargos: true
    loadstages:
      loading: [S1, S2, S3]
      loaded: [S1, S2, S3]
      stages:
        - id: S1
          y: 1
        - id: S2
          y: 27
        - id: S3
          y: 53
    liveries:
      - id: L1
        x: 1
    cargos:
      # TODO: barrels, copper, paper, steel_coil, steel_wire, tyres
      - id: crates
        filename: "build/gfx/Gen3_Flat_Wagon_Crates.png"
        cargos: [GOOD]
      - id: explosives
        filename: "build/gfx/Gen3_Flat_Wagon_Explosives.png"
        cargos: [BOOM]
      - id: planks
        filename: "build/gfx/Gen3_Flat_Wagon_Planks.png"
        cargos: [WDPR]
      - id: wood
        filename: "build/gfx/Gen3_Flat_Wagon_Wood.png"
        cargos: [WOOD]
      - id: steel_sheets
        filename: "build/gfx/Gen3_Flat_Wagon_Steel_Sheets.png"
        cargos: [STSH]
      - id: tractor
        filename: "build/gfx/Gen3_Flat_Wagon_Tractor.png"
        cargos: []
    random:
      - id: steel
        cargos: [STEL, STAL]
        options:
          steel_sheets: 2
      - id: supplies
        cargos: [ENSP, FMSP]
        options: 
          crates: 7
          tractor: 3
      - id: building_materials
        cargos: [BDMT]
        options:
          planks: 2
          steel: 2
          # copper: 1
      